name: Report a broken or outdated source
description: A linked page moved, was retired, or no longer says what the guidelines cite it for.
labels: [freshness]
body:
  - type: input
    id: url
    attributes:
      label: Source URL
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What happened
      options:
        - The page is gone or retired
        - The page moved to a new URL
        - The content changed and no longer supports the rule
        - The advice is outdated for current versions
    validations:
      required: true
  - type: input
    id: rules
    attributes:
      label: Affected rule IDs
      description: Optional. SOURCES.md lists where each source is used.
  - type: textarea
    id: details
    attributes:
      label: Details
      description: The new URL, or what the page says now.
