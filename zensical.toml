# Site configuration for Zensical (https://zensical.org/), the successor to Material for MkDocs.
# Don't build from this file directly: run `python3 scripts/build_site.py`, which stages the
# Markdown, adds docs_dir, site_dir and the navigation, and builds the site into build/site/.

[project]
site_name = "Architecture Guidelines"
site_description = "Reference-first software architecture guidelines, with sources, scores, rule IDs, checklists and AI skills."
site_url = "https://depuschm.github.io/architecture-guidelines/"
repo_url = "https://github.com/depuschm/architecture-guidelines"
repo_name = "depuschm/architecture-guidelines"
# Pages are staged with their repository paths; build_site.py fixes the few that it renames.
edit_uri = "edit/main/"
copyright = "Guidelines: CC BY 4.0 · Code and skills: MIT"

[project.theme]
language = "en"
# System fonts: the default loads Google Fonts, which sends every visitor's IP address to Google
# (see PRIV-5 and PRIV-11 in general/privacy.md).
font = false
# Written into the site by build_site.py.
favicon = "assets/favicon.svg"
# No navigation.sections: with this many platform folders, collapsible platforms keep the
# sidebar short, and navigation.prune leaves the closed ones out of each page.
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.prune",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/blocks"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tasklist.custom_checkbox = true
